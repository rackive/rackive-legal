<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RACKIVE · 이 옷 보기</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#17171a">
<meta property="og:title" content="RACKIVE · 이 옷 보기">
<meta property="og:description" content="아카이브·빈티지·세컨핸드 마켓. 가격과 상태를 확인하고, 문의·네고·구매 요청은 RACKIVE 앱에서.">
<meta name="apple-itunes-app" content="app-id=6823965937">
<!--
  태그 QR → 매물 미리보기 (2026-11-21). 옷에 단 태그의 QR이 이 페이지(rackive.com/i/?id=<매물 id>)를 연다.
  - 로그인 없이 보이는 정보는 DB 함수 public_listing(uuid)이 정한 범위뿐이다(supabase_public_listing.sql). 판매를 내린 옷은 아무것도 보여주지 않는다.
  - 아래 키는 앱에도 들어 있는 공개용(anon) 키다. 데이터 보호는 RLS와 위 함수가 맡는다.
  - 값은 scripts/build_item_page.js가 src/lib/supabase.js에서 읽어 채운다. 이 파일을 직접 고치지 말고 site_src/i/index.html을 고친 뒤 스크립트를 돌릴 것.
-->
<style>
  :root{--bg:#17171a;--card:#1e1e22;--text:#f0ece4;--dim:#c9c5bd;--muted:#8a8a90;--gold:#c8b97a;--goldb:#3a3424;--border:#2a2a2e;--danger:#d47a6a}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--dim);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.55}
  main{max-width:520px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 14px}
  .brandmark{display:block;line-height:0;text-decoration:none}
  .wordmark{display:block;width:96px;height:auto}
  .tagline{font-size:10px;letter-spacing:3px;color:var(--muted);white-space:nowrap}
  .photo{position:relative;width:100%;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--border)}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;left:12px;top:12px;font-size:13px;line-height:18px;padding:5px 12px;border-radius:999px;background:rgba(23,23,26,.82);color:var(--text);border:1px solid var(--border)}
  .badge.sold{color:var(--muted)}
  .thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
  .thumbs::-webkit-scrollbar{display:none}
  .thumbs button{flex:0 0 auto;width:58px;height:58px;padding:0;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--card);cursor:pointer}
  .thumbs button[aria-current="true"]{border-color:var(--gold)}
  .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
  .brand{margin:18px 2px 2px;color:var(--gold);font-size:13px;letter-spacing:2px;overflow-wrap:anywhere}
  h1{margin:0 2px;color:var(--text);font-size:22px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
  .pricerow{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 10px;margin:12px 2px 0}
  .price{color:var(--text);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .was{color:var(--muted);font-size:14px;text-decoration:line-through;font-variant-numeric:tabular-nums}
  .chip{font-size:12px;color:var(--gold);border:1px solid var(--goldb);background:#221f16;border-radius:999px;padding:3px 9px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 2px 0;font-size:14px}
  dt{color:var(--muted)}
  dd{margin:0;color:var(--dim);overflow-wrap:anywhere}
  .note{margin:20px 0 0;padding:14px 16px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:14px}
  .note b{color:var(--text);font-weight:600}
  .cta{display:grid;gap:10px;margin-top:16px}
  .btn{display:block;text-align:center;text-decoration:none;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:600}
  .btn.primary{background:var(--gold);color:#17171a}
  .btn.ghost{color:var(--text);border:1px solid var(--border);background:transparent;font-weight:500}
  .state{padding:56px 12px;text-align:center}
  .state h1{font-size:19px;margin-bottom:8px}
  .state p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .skel{border-radius:10px;background:linear-gradient(90deg,#1e1e22 0%,#26262b 50%,#1e1e22 100%);background-size:200% 100%;animation:sh 1.2s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
  footer{margin-top:36px;color:var(--muted);font-size:12px;line-height:1.7}
  footer a{color:var(--gold);text-decoration:none}
  a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style></head><body><main>
<header>
  <!-- 앱과 같은 워드마크. 빌드 때 scripts/wordmark_svg.js 가 src/components/Wordmark.js 글리프로 채운다 -->
  <a class="brandmark" href="../"><svg class="wordmark" viewBox="0 0 2629 820" role="img" aria-label="RACKIVE" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0,800) scale(1,-1)"><path transform="translate(0,0)" fill="#f0ece4" d="M1 510 111 570Q118 568 127.5 564.5Q137 561 153.5 545.0Q170 529 170 509Q175 511 217.5 540.5Q260 570 272 570Q304 570 332.0 528.0Q360 486 360 451V402L257 344L240 358Q240 442 224 454Q206 467 170 467V148Q170 87 211 79V57L110 0Q88 9 69.0 29.5Q50 50 50 68V400Q50 444 34.5 466.0Q19 488 1 488Z"/><path transform="translate(360,0)" fill="#f0ece4" d="M360 438V155Q360 118 372.0 103.5Q384 89 409 83V61L300 0Q278 9 259.0 29.5Q240 50 240 67L115 0Q112 2 106.0 5.5Q100 9 85.5 20.5Q71 32 60 45Q30 78 30 120V284Q30 300 82.0 325.0Q134 350 186 366L239 383Q239 440 209.0 462.5Q179 485 93 485V515Q248 570 267 570Q300 570 330.0 527.0Q360 484 360 438ZM240 112V338Q215 329 202.5 323.0Q190 317 176 304Q150 280 150 221V156Q150 130 165.5 113.5Q181 97 200.0 97.0Q219 97 240 112Z"/><path transform="translate(770,0)" fill="#f0ece4" d="M188 473Q178 473 170 463V187Q170 110 236 92Q270 84 317 84V55Q153 0 142 0Q112 0 81.0 42.5Q50 85 50 142V478Q50 485 164.5 527.5Q279 570 296 570Q302 570 310.0 541.0Q318 512 328.5 471.0Q339 430 350.5 410.5Q362 391 394 391V371Q372 361 319.5 335.5Q267 310 263 310Q248 310 225.0 391.5Q202 473 188 473Z"/><g transform="translate(1134,0)"><path fill="#f0ece4" d="M170 148Q170 87 211 79V57L110 0Q88 9 69.0 29.5Q50 50 50 68V563Q50 590 41.0 601.5Q32 613 10 613V641Q140 709 242 769L258 737Q248 732 230.0 717.5Q212 703 200 688Q170 650 170 602V510Q263 570 280 570Q308 570 342.0 533.5Q376 497 376 452V343Q376 332 272 292Q335 125 395 100Q414 91 437 89V60Q344 0 320 0Q288 0 238.5 97.5Q189 195 170 260ZM170 309Q190 309 242 334L260 343V388Q260 473 202 473L170 468Z"/><path fill="#c8b97a" d="M170 309L170 260Q170.4 258.6 170.8 257.3L272 292L272 292Q376 332 376 343L376 452Q376 497 342 533.5Q308 570 280 570Q263 570 170 510L170 468L202 473Q260 473 260 388L260 343L242 334Q190 309 170 309Z"/></g><path transform="translate(1554,0)" fill="#c8b97a" d="M170 502V148Q170 87 211 79V57L110 0Q88 9 69.0 29.5Q50 50 50 68V422Q50 483 9 491V513L110 570Q132 561 151.0 540.5Q170 520 170 502ZM35 695V756Q35 759 76.5 774.5Q118 790 124.5 790.0Q131 790 143.5 773.0Q156 756 156 738V665Q156 662 116.0 646.5Q76 631 67.0 631.0Q58 631 46.5 648.5Q35 666 35 695Z"/><path transform="translate(1774,0)" fill="#c8b97a" d="M381 433V93Q381 84 274.0 42.0Q167 0 136.0 0.0Q105 0 77.5 47.0Q50 94 50 130V423Q50 478 1 488V510L110 571Q132 562 149.5 543.0Q167 524 170 509L292 570Q322 570 351.5 527.0Q381 484 381 433ZM260 90V373Q260 437 241.0 456.0Q222 475 170 475V134Q170 109 184.0 92.0Q198 75 214.0 75.0Q230 75 260 90Z"/><path transform="translate(2204,0)" fill="#c8b97a" d="M295 570Q300 570 320.0 554.5Q340 539 360.0 511.5Q380 484 380 458V290Q380 272 327.0 246.0Q274 220 224.5 203.5Q175 187 171 187Q171 110 238 92Q271 84 317 84V55Q153 0 142 0Q112 0 81.0 42.5Q50 85 50 142V478Q50 485 164.0 527.5Q278 570 295 570ZM170 463V232Q260 257 260 340V411Q260 439 247.0 458.5Q234 478 214.0 478.0Q194 478 170 463Z"/></g></svg></a>
  <span class="tagline">RACK TO ARCHIVE</span>
</header>

<div id="app" aria-live="polite">
  <div class="photo skel" aria-hidden="true"></div>
  <div class="skel" style="height:14px;width:38%;margin:20px 2px 8px" aria-hidden="true"></div>
  <div class="skel" style="height:24px;width:72%;margin:0 2px" aria-hidden="true"></div>
  <div class="skel" style="height:28px;width:44%;margin:14px 2px 0" aria-hidden="true"></div>
</div>

<footer>상호: RACKIVE · 대표자: 최인혜 (INHYE CHOI) · 문의 <a href="mailto:contact@rackive.com">contact@rackive.com</a><br>
<a href="../terms.html">이용약관</a> · <a href="../privacy.html">개인정보처리방침</a></footer>
</main>

<script>
(function () {
  var SUPABASE_URL = 'https://ozrbobvficrnpmlfiwed.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96cmJvYnZmaWNybnBtbGZpd2VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MjEzOTIsImV4cCI6MjA5Njk5NzM5Mn0.pIUjhBud0SM6XcC3_IXdm6MQp4UTBgME6LGgzXqQJcM';
  var APP_STORE = 'https://apps.apple.com/kr/app/rackive/id6823965937';
  var CONDITION = { new: '새 상품', like_new: '거의 새것', good: '좋음', fair: '보통', worn: '많이 착용함' };
  var CATEGORY = { Outer: '아우터', Top: '상의', Bottom: '하의', Shoes: '신발', Acc: '액세서리' };
  var app = document.getElementById('app');

  function el(tag, attrs, kids) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }
  function won(v) {
    return (typeof v === 'number' && isFinite(v) && v > 0) ? v.toLocaleString('ko-KR') + '원' : '가격 문의';
  }
  function httpsUrl(u) { return (typeof u === 'string' && /^https:\/\//.test(u)) ? u : null; }
  function buttons(id) {
    return el('div', { class: 'cta' }, [
      el('a', { class: 'btn primary', href: APP_STORE, text: 'App Store에서 RACKIVE 받기' }),
      id ? el('a', { class: 'btn ghost', href: 'rackive://i/' + id, text: '이미 앱이 있어요 · 앱에서 열기' }) : null,
    ]);
  }
  function state(title, body, id) {
    app.replaceChildren(el('div', { class: 'state' }, [
      el('h1', { text: title }), el('p', { text: body }), buttons(id),
    ]));
  }

  function render(it) {
    document.title = 'RACKIVE · ' + [it.brand, it.name].filter(Boolean).join(' ');
    var urls = [httpsUrl(it.image_url)].concat((it.photos || []).map(httpsUrl)).filter(Boolean);
    var alt = [it.brand, it.name].filter(Boolean).join(' ') || '매물 사진';

    var main = el('img', { alt: alt, src: urls[0] || '' });
    var photo = el('div', { class: 'photo' }, [urls.length ? main : null]);
    if (it.status === 'reserved') photo.appendChild(el('span', { class: 'badge', text: '예약 중' }));
    if (it.status === 'sold') photo.appendChild(el('span', { class: 'badge sold', text: '판매 완료' }));

    var thumbs = null;
    if (urls.length > 1) {
      thumbs = el('div', { class: 'thumbs', role: 'group', 'aria-label': '다른 사진' });
      urls.forEach(function (u, i) {
        var b = el('button', { type: 'button', 'aria-label': (i + 1) + '번째 사진', 'aria-current': i === 0 ? 'true' : 'false' },
          [el('img', { alt: '', src: u, loading: 'lazy' })]);
        b.addEventListener('click', function () {
          main.src = u;
          Array.prototype.forEach.call(thumbs.children, function (c) { c.setAttribute('aria-current', c === b ? 'true' : 'false'); });
        });
        thumbs.appendChild(b);
      });
    }

    var brand = [it.brand, it.collab_brand].filter(Boolean).join(' × ');
    var priceRow = el('div', { class: 'pricerow' });
    if (it.status !== 'sold') {
      priceRow.appendChild(el('span', { class: 'price', text: won(it.price) }));
      if (typeof it.original_price === 'number' && typeof it.price === 'number' && it.original_price > it.price) {
        priceRow.appendChild(el('span', { class: 'was', text: won(it.original_price) }));
      }
    }
    if (CONDITION[it.condition]) priceRow.appendChild(el('span', { class: 'chip', text: CONDITION[it.condition] }));

    var dl = el('dl');
    function row(k, v) { if (v) { dl.appendChild(el('dt', { text: k })); dl.appendChild(el('dd', { text: String(v) })); } }
    row('종류', CATEGORY[it.category] || it.category);
    row('사이즈', it.size);
    row('색상', it.color);
    var s = it.seller || {};
    row('판매', s.shop_name ? [s.shop_name, s.shop_location].filter(Boolean).join(' · ') : (s.username ? '@' + s.username : ''));

    var note = el('p', { class: 'note' });
    if (it.status === 'sold') {
      note.appendChild(el('b', { text: '이 옷은 새 주인을 만났어요. ' }));
      note.appendChild(document.createTextNode('RACKIVE 앱에서 다른 아카이브를 둘러보세요.'));
    } else {
      note.appendChild(el('b', { text: '문의·네고·구매 요청은 RACKIVE 앱에서. ' }));
      note.appendChild(document.createTextNode('실측과 상태 사진도 앱에서 더 볼 수 있어요.'));
    }

    // replaceChildren은 null을 "null" 글자로 넣으므로 빈 항목은 걸러서 넘긴다
    var parts = [
      photo, thumbs,
      brand ? el('div', { class: 'brand', text: brand }) : null,
      el('h1', { text: it.name || '이름 없는 옷' }),
      priceRow, dl.children.length ? dl : null, note, buttons(it.id),
    ].filter(Boolean);
    app.replaceChildren.apply(app, parts);
  }

  var id = (new URLSearchParams(location.search).get('id') || location.hash.replace(/^#/, '') || '').trim().toLowerCase();
  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(id)) {
    state('옷을 찾지 못했어요', '태그의 QR을 다시 찍어 주세요. RACKIVE 앱에서는 더 많은 아카이브를 볼 수 있어요.', null);
    return;
  }
  fetch(SUPABASE_URL + '/rest/v1/rpc/public_listing', {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_item_id: id }),
  }).then(function (r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function (it) {
    if (!it) return state('옷을 찾지 못했어요', '태그의 QR을 다시 찍어 주세요.', null);
    if (it.status === 'off') return state('지금은 판매 중이 아니에요', '판매자가 이 옷의 판매를 잠시 내렸어요. RACKIVE 앱에서 다른 아카이브를 둘러보세요.', id);
    render(it);
  }).catch(function () {
    app.replaceChildren(el('div', { class: 'state' }, [
      el('h1', { text: '불러오지 못했어요' }),
      el('p', { text: '연결 상태를 확인하고 다시 시도해 주세요.' }),
      (function () { var a = el('a', { class: 'btn ghost', href: location.href, text: '다시 시도' }); return el('div', { class: 'cta' }, [a]); })(),
    ]));
  });
})();
</script>
</body></html>
